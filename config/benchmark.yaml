# Path-AGNN-Cox benchmark configuration.
paths:
  processed: data/processed            # per-cancer train.csv + external/<GSE>.csv
  pathway_gmt: data/pathways/kegg_cancer_core.gmt
  results: results
  figures: results/figures

models:
  path_agnn_cox:
    hidden: 32
    n_layers: 2
    mlp_hidden: 32
    dropout: 0.1
    epochs: 100
    lr: 0.001
    batch_size: 128
    l2: 0.0001
    lambda_sparse: 0.001
    lambda_consist: 0.1
    patience: 15
    cv_folds: 5
  path_agnn_cox_static:       # ablation: -Adaptive (fixed normalized adjacency)
    hidden: 32
    n_layers: 2
    mlp_hidden: 32
    dropout: 0.1
    epochs: 100
    lr: 0.001
    batch_size: 128
    l2: 0.0001
    lambda_sparse: 0.001
    lambda_consist: 0.1
    patience: 15
    use_adaptive: false
  path_agnn_cox_noreg:        # ablation: -Regularization (no sparse/consistency)
    hidden: 32
    n_layers: 2
    mlp_hidden: 32
    dropout: 0.1
    epochs: 100
    lr: 0.001
    batch_size: 128
    l2: 0.0001
    lambda_sparse: 0.0
    lambda_consist: 0.0
    patience: 15
    use_adaptive: true
  plain_gnn:
    adj_mode: identity
  lasso_cox: {penalizer: 0.05}
  ridge_cox: {penalizer: 0.1}
  elastic_net: {l1_ratio: 0.5, penalizer: 0.1}
  rsf: {n_estimators: 500, min_samples_leaf: 15}
  deepsurv: {hidden: [32, 16]}
  cox_nnet: {hidden: [64], dropout: 0.0}

evaluation:
  auc_times_quantiles: [0.25, 0.5, 0.75]
  seed: 42